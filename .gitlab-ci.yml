# CI for the kaiv-rs workspace.
#
# Jobs run only where KAIV_CI_CANONICAL is set — a project-level
# variable on the authoritative project. Public mirrors are inert
# publishing surfaces and must not run builds.
#
# The conformance vectors are vendored into the repo, so no job
# needs the spec project or a cross-project token.

variables:
  CARGO_HOME: $CI_PROJECT_DIR/.cargo
  CARGO_TERM_COLOR: always
  # Every converter, plus serde and net. Never --all-features in a
  # test job: it enables both collation backends, and while that now
  # builds, it resolves to ICU and leaves the colligo path untested
  # (the `collation-colligo` job below covers it).
  FEATURES: json,yaml,toml,xml,cbor,avro,proto,asn1,graphql,xsd,serde,net,collation-icu

default:
  image: rust:1.95
  cache:
    key:
      files:
        - Cargo.lock
    paths:
      - .cargo/registry/index
      - .cargo/registry/cache
      - target
  before_script:
    - rustc --version && cargo --version

workflow:
  rules:
    - if: $KAIV_CI_CANONICAL
      when: always
    - when: never

stages: [check, test, verify]

# ------------------------------------------------------------- check

fmt:
  stage: check
  script:
    - rustup component add rustfmt
    - cargo fmt --all --check

clippy:
  stage: check
  script:
    - rustup component add clippy
    - cargo clippy --workspace --all-targets --all-features -- -D warnings

# -------------------------------------------------------------- test

# The conformance tree is vendored (tests/conformance-vectors,
# refreshed by scripts/refresh-vectors.sh), so this job needs no
# checkout of the spec repo and no cross-project token. The
# harness refuses to run if the tree is missing, and a separate
# test asserts it still names the spec commit it came from.
test:
  stage: test
  script:
    # Workspace first (binaries and the LSP), then the library with
    # every converter — that feature set is what arms the stress
    # suite, which compiles to nothing without it.
    - cargo test --workspace
    - cargo test -p kaiv --features "$FEATURES"
    - cargo test -p kaiv --doc --features "$FEATURES"

# A heavier stress run than `cargo test` does by default. Seeded, so
# a failure here reproduces exactly.
stress:
  stage: test
  variables:
    KAIV_STRESS_ITERS: "600"
  script:
    - cargo test -p kaiv --features "$FEATURES" --test stress

# ------------------------------------------------------------ verify

# Features are additive, so every combination has to build. These are
# the boundaries: nothing, everything, each collation backend alone,
# and the hub feature by itself (the converters layer on `json`).
features:
  stage: verify
  parallel:
    matrix:
      - FEATURE_SET:
          - "--no-default-features"
          - "--all-features"
          - "--no-default-features --features collation-colligo"
          - "--no-default-features --features collation-icu"
          - "--features json"
          - "--features serde"
          - "--features net"
  script:
    - cargo build -p kaiv $FEATURE_SET
    - cargo clippy -p kaiv $FEATURE_SET -- -D warnings

msrv:
  stage: verify
  image: rust:1.85
  script:
    # The declared rust-version is a promise; check it against the
    # LOCKED graph rather than whatever floats today. kaiv-wasm is
    # excluded here — it selects the colligo backend, whose let
    # chains need 1.88, and it declares that separately.
    - cargo check -p kaiv -p kaiv-cli -p kaiv-lsp --locked
    - cargo check -p kaiv --locked --features "$FEATURES"

wasm:
  stage: verify
  script:
    - rustup target add wasm32-unknown-unknown
    - cargo build -p kaiv-wasm --target wasm32-unknown-unknown

docs:
  stage: verify
  variables:
    RUSTDOCFLAGS: "-D warnings"
  script:
    # Both backends: each supplies its own `collate` module, so a
    # broken doc link in one is invisible from the other.
    - cargo doc -p kaiv --no-deps --all-features
    - cargo doc -p kaiv --no-deps --no-default-features --features collation-colligo

package:
  stage: verify
  script:
    # Build the tarball for the one crate whose dependencies are all
    # published. kaiv-cli and kaiv-lsp depend on the version of kaiv
    # this commit introduces, which by definition is not on crates.io
    # yet — packaging them would fail on resolution until release
    # order puts kaiv there first. --allow-dirty because the target
    # cache above is not clean.
    - cargo package -p kaiv --no-verify --allow-dirty
    # The file list needs no registry, so every crate can be checked
    # for the things that are silently missing until someone
    # downloads the tarball: the licence texts a crate promises in
    # its metadata, and the readme crates.io renders.
    - for c in kaiv kaiv-cli kaiv-lsp; do
        cargo package --list -p $c --allow-dirty > "/tmp/$c.files";
        for f in LICENSE-MIT LICENSE-APACHE README.md; do
          grep -qx "$f" "/tmp/$c.files" || { echo "$c: $f missing from the package"; exit 1; };
        done;
      done
